[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "turismo-rag"
version = "0.1.0"
description = "RAG local de turismo de Valencia con Ollama, ChromaDB y FastAPI"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "langchain-ollama>=1.0,<2",
    "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.14.0"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[project.scripts]
turismo-rag = "turismo_rag.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
